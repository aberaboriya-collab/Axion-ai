<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131c">
<title>AXION AI</title>
<style>
:root{color-scheme:dark;--bg:#10131c;--panel:#171d2a;--panel2:#222938;--line:#30384a;--text:#f5f6ff;--muted:#aab5d5;--purple:#7655ed}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#252044 0,transparent 55%),var(--bg);color:var(--text);font-family:Arial,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#10131cdd}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:2px}
.brand-dot{width:11px;height:11px;border-radius:50%;background:#9c7aff;box-shadow:0 0 15px #9875ff}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:white;border-radius:12px;padding:9px 12px;cursor:pointer;font-size:18px}
main{width:min(900px,100%);margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px}
.orb-area{display:flex;flex-direction:column;align-items:center;padding:20px 0 8px;flex-shrink:0}
.orb{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#6c9cff 20%,#7045e8 50%,#111b48 80%);box-shadow:0 0 20px #657fff,0 0 50px #6048e8,inset -10px -10px 25px #171b5e;animation:float 3s ease-in-out infinite,glow 2s ease-in-out infinite alternate}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(8deg)}}
@keyframes glow{from{box-shadow:0 0 15px #657fff,0 0 30px #6048e8}to{box-shadow:0 0 30px #657fff,0 0 65px #8b55ff}}
.status{color:var(--muted);margin-top:12px;font-size:13px}
#chat{flex:1;overflow-y:auto;padding:12px 0 20px;scroll-behavior:smooth}
.message{padding:13px 16px;border-radius:17px;margin:12px 0;max-width:min(82%,680px);line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#394b83;margin-left:auto;border-bottom-right-radius:5px}
.bot{background:var(--panel2);margin-right:auto;border-bottom-left-radius:5px}
.bot a{color:#b9a8ff}
.composer-wrap{padding:12px 0 18px;border-top:1px solid var(--line);background:linear-gradient(transparent,var(--bg) 20%)}
.composer{display:flex;gap:9px;align-items:center;background:var(--panel);border:1px solid #444c60;border-radius:18px;padding:7px}
#message{flex:1;min-width:0;padding:12px 8px;border:0;background:transparent;color:white;outline:none;font-size:15px}
.send{width:44px;height:44px;border:0;border-radius:13px;background:var(--purple);color:white;font-size:19px;cursor:pointer}
.tool-row{display:flex;gap:8px;margin-top:9px;justify-content:center;flex-wrap:wrap}
.tool{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer}
.tool:hover,.icon-btn:hover{border-color:#8c73ff;color:white}
button:disabled{opacity:.55;cursor:not-allowed}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:48px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:7px;min-width:170px;box-shadow:0 12px 35px #0008}
.menu-pop button{display:block;width:100%;text-align:left;background:transparent;border:0;color:white;padding:11px;border-radius:8px;cursor:pointer}
.menu-pop button:hover{background:var(--panel2)}
.hidden{display:none!important}
#file{display:none}
footer{text-align:center;color:#77819b;font-size:11px;padding:0 0 10px}
@media(max-width:600px){header{height:60px}.orb{width:65px;height:65px}.message{max-width:90%}main{padding:0 12px}.composer-wrap{padding-bottom:max(12px,env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="newChat" aria-label="New chat" title="New chat">＋</button>
  <div class="brand"><span class="brand-dot"></span><span>AXION AI</span></div>
  <div class="menu">
    <button class="icon-btn" id="menuButton" aria-label="Settings and menu">☰</button>
    <div class="menu-pop hidden" id="menuPop">
      <button id="clearChat">Clear conversation</button>
      <button id="voiceToggle">Voice: on/off</button>
      <button id="about">About AXION</button>
    </div>
  </div>
</header>
<main>
  <section class="orb-area">
    <div class="orb" id="orb"></div>
    <div class="status" id="status">AXION is ready</div>
  </section>
  <section id="chat" aria-live="polite">
    <div class="message bot">Hello! I'm AXION, your AI assistant. Ask me a question to get started.</div>
  </section>
  <section class="composer-wrap">
    <div class="composer">
      <input id="message" autocomplete="off" placeholder="Ask AXION anything..." aria-label="Your message">
      <button class="icon-btn" id="mic" title="Voice input" aria-label="Voice input">🎙</button>
      <button class="send" id="send" aria-label="Send message">➤</button>
    </div>
    <div class="tool-row">
      <label class="tool" for="file">＋ Attach text file</label>
      <button class="tool" id="speakLast">🔊 Read last answer</button>
    </div>
    <input type="file" id="file" accept=".txt,.md,text/plain,text/markdown">
  </section>
  <footer>AXION AI 2.0 · AI responses may make mistakes</footer>
</main>
<script src="Brain.js"></script>
<script>
const chat=document.getElementById("chat"), input=document.getElementById("message");
const statusEl=document.getElementById("status"), orb=document.getElementById("orb");
const sendBtn=document.getElementById("send"), menuPop=document.getElementById("menuPop");
let history=JSON.parse(localStorage.getItem("axion-history")||"[]");
let lastAnswer="", voiceEnabled=false, attachedText="";

function addMessage(text,who,save=true){
  const node=document.createElement("div"); node.className="message "+who; node.textContent=text;
  chat.appendChild(node); chat.scrollTop=chat.scrollHeight;
  if(save){history.push({role:who==="user"?"user":"assistant",content:text});history=history.slice(-30);localStorage.setItem("axion-history",JSON.stringify(history));}
}
function restoreHistory(){
  if(!history.length)return;
  chat.innerHTML="";
  history.forEach(m=>{const n=document.createElement("div");n.className="message "+(m.role==="user"?"user":"bot");n.textContent=m.content;chat.appendChild(n);});
  chat.scrollTop=chat.scrollHeight;
}
restoreHistory();

async function sendMessage(){
  const text=input.value.trim(); if(!text)return;
  input.value=""; addMessage(text,"user");
  const promptText=attachedText ? text+"\n\n[Attached document text]\n"+attachedText : text;
  attachedText="";
  history[history.length-1].content=promptText;
  localStorage.setItem("axion-history",JSON.stringify(history));
  statusEl.textContent="AXION is thinking...";orb.style.filter="brightness(1.5)";sendBtn.disabled=true;
  try{
    const reply=await AXION_BRAIN.think(history);
    addMessage(reply,"bot");lastAnswer=reply;statusEl.textContent="AXION is ready";
    if(voiceEnabled)speak(reply);
  }catch(err){addMessage("Sorry — "+err.message,"bot",false);statusEl.textContent="Connection needs attention";}
  finally{orb.style.filter="brightness(1)";sendBtn.disabled=false;input.focus();}
}
document.getElementById("send").addEventListener("click",sendMessage);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}});
document.getElementById("newChat").onclick=()=>{history=[];localStorage.removeItem("axion-history");chat.innerHTML='<div class="message bot">New conversation started. What would you like to explore?</div>';lastAnswer="";};
document.getElementById("menuButton").onclick=()=>menuPop.classList.toggle("hidden");
document.getElementById("clearChat").onclick=()=>{history=[];localStorage.removeItem("axion-history");chat.innerHTML="";menuPop.classList.add("hidden");addMessage("Conversation cleared. How can I help?","bot",false);};
document.getElementById("voiceToggle").onclick=()=>{voiceEnabled=!voiceEnabled;menuPop.classList.add("hidden");statusEl.textContent="Voice replies "+(voiceEnabled?"enabled":"disabled");};
document.getElementById("about").onclick=()=>{menuPop.classList.add("hidden");addMessage("AXION AI 2.0 is a personal AI assistant interface connected to an AI model through a secure server.","bot",false);};
document.getElementById("speakLast").onclick=()=>{if(lastAnswer)speak(lastAnswer);else statusEl.textContent="There is no answer to read yet.";};
function speak(text){if(!("speechSynthesis" in window)){statusEl.textContent="Speech is not supported in this browser.";return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1;speechSynthesis.speak(u);}
document.getElementById("mic").onclick=()=>{
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){statusEl.textContent="Voice input is not supported in this browser.";return;}
  const rec=new SpeechRecognition();rec.lang="en-US";rec.interimResults=false;
  statusEl.textContent="Listening...";
  rec.onresult=e=>{input.value=e.results[0][0].transcript;statusEl.textContent="Voice captured — press send.";};
  rec.onerror=()=>statusEl.textContent="Could not hear you. Try again.";
  rec.onend=()=>{if(statusEl.textContent==="Listening...")statusEl.textContent="AXION is ready";};
  rec.start();
};
document.getElementById("file").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  if(file.size>100000){statusEl.textContent="Please choose a text file smaller than 100 KB.";e.target.value="";return;}
  attachedText=await file.text();statusEl.textContent="Attached "+file.name+" — ask a question about it.";
  e.target.value="";
};
document.addEventListener("click",e=>{if(!e.target.closest(".menu"))menuPop.classList.add("hidden");});
</script>
</body>
</html>
